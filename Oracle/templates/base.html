<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Panel Café Real{% endblock %}</title>
<link rel="stylesheet" href="/admin.css">
<style>
  /* --- Selector de estado de entrada (libre / tiene entrada) --- */
  .opciones-entrada{ display:flex; flex-direction:column; gap:6px; margin:4px 0 2px; }
  .opcion-entrada{ display:flex; align-items:center; gap:8px; font-weight:normal; cursor:pointer; }
  .opcion-entrada input[type="radio"]{ width:auto; margin:0; flex-shrink:0; }
  .precio-entrada-wrap{ margin-top:4px; }
  .precio-entrada-wrap[hidden]{ display:none; }

  /* --- Checkbox con texto al lado (no encima) --- */
  .opcion-checkbox{ display:flex; align-items:center; gap:8px; font-weight:normal; cursor:pointer; }
  .opcion-checkbox input[type="checkbox"]{ width:auto; margin:0; flex-shrink:0; }

  /* --- Separador simple entre secciones de un formulario --- */
  .separador-form{ border:none; border-top:1px solid var(--linea, #444); margin:18px 0 10px; }
</style>
<script>
  // --- Funciones compartidas para el campo "precio de entrada" ---
  // Se cargan en el <head>, antes del contenido, para que ya existan
  // cuando el script de cada formulario las llame.

  // Formatea un número como miles con puntos: 40000 -> "40.000"
  function formatoMiles(valor) {
    const limpio = (valor || "").replace(/\D/g, "");
    if (!limpio) return "";
    return new Intl.NumberFormat("es-CO").format(parseInt(limpio, 10));
  }

  // Conecta un grupo de radios (entrada_estado) con la casilla de precio:
  // solo se muestra/habilita cuando el valor elegido es "PAGO" (la casilla
  // se puede dejar vacía a propósito — eso el backend lo guarda como
  // "precio por confirmar"), y formatea el número en miles mientras se escribe.
  function inicializarSelectorEntrada(nombreGrupo, wrapId, inputId) {
    document.addEventListener("DOMContentLoaded", () => {
      const radios = document.querySelectorAll(`input[name="${nombreGrupo}"]`);
      const wrap = document.getElementById(wrapId);
      const input = document.getElementById(inputId);
      if (!radios.length || !wrap || !input) return;

      function actualizar() {
        const seleccion = document.querySelector(`input[name="${nombreGrupo}"]:checked`);
        const esPago = !!seleccion && seleccion.value === "PAGO";
        wrap.hidden = !esPago;
        input.disabled = !esPago;
        if (!esPago) input.value = "";
      }

      radios.forEach(r => r.addEventListener("change", actualizar));
      input.addEventListener("input", () => {
        const alFinal = input.selectionStart === input.value.length;
        input.value = formatoMiles(input.value);
        if (alFinal) input.setSelectionRange(input.value.length, input.value.length);
      });

      actualizar();
    });
  }
</script>
</head>
<body>
  {% if session.get('admin_id') %}
  <header class="topbar">
    <div class="brand">Café Real · Panel</div>
    <nav>
      <span class="usuario">{{ session.get('admin_usuario') }}</span>
      <a href="{{ url_for('logout') }}" class="btn-out">Cerrar sesión</a>
    </nav>
  </header>
  {% endif %}

  <main class="contenido">
    {% with mensajes = get_flashed_messages() %}
      {% if mensajes %}
        <div class="flash">
          {% for m in mensajes %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
