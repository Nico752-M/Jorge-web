<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión — Panel admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA: este archivo no extiende base.html, así que necesita su propio link -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15120e">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root{ --hierro:#161311; --hierro-2:#1d1a17; --crema:#f3ece2; --concreto:#a99c8c;
           --oro:#c9a24b; --oro-suave:#e0c27a; --linea:#332d27; }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--hierro); color:var(--crema);
      font-family:'Public Sans', Arial, sans-serif; padding:24px;
    }
    .login-box{
      width:100%; max-width:380px; background:var(--hierro-2);
      border:1px solid var(--linea); padding:36px 30px; border-radius:2px;
    }
    .login-box h2{ margin:0 0 6px; font-size:1.4rem; }
    .login-box p{ color:var(--concreto); font-size:.9rem; line-height:1.5; margin:0 0 22px; }
    form{ display:flex; flex-direction:column; gap:12px; }
    input{
      background:var(--hierro); border:1px solid var(--linea); color:var(--crema);
      padding:12px 14px; font-size:.92rem; border-radius:2px; outline:none;
    }
    input:focus{ border-color:var(--oro); }
    button{
      margin-top:6px; background:var(--oro); color:#1a1512; border:none;
      padding:13px; font-size:.92rem; font-weight:600; cursor:pointer; border-radius:2px;
    }
    button:hover{ background:var(--oro-suave); }
    .mensajes{ margin-bottom:16px; }
    .mensajes p{
      color:#e6a99b; font-size:.85rem; line-height:1.4;
      border:1px solid var(--linea); padding:8px 10px; border-radius:2px; margin:0 0 8px;
    }

    .overlay-carga{
      position:fixed; inset:0; z-index:999;
      background:rgba(21,18,14,.72);
      backdrop-filter:blur(5px) saturate(120%);
      -webkit-backdrop-filter:blur(5px) saturate(120%);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      opacity:0; pointer-events:none; transition:opacity .18s ease;
    }
    .overlay-carga.visible{ opacity:1; pointer-events:all; }
    .spinner-carga{
      width:34px; height:34px; border-radius:50%;
      border:3px solid rgba(201,162,75,.25); border-top-color:var(--oro);
      animation:girar .7s linear infinite;
    }
    .overlay-carga span{ font-size:.82rem; color:var(--concreto); letter-spacing:.02em; }
    @keyframes girar{ to{ transform:rotate(360deg); } }
  </style>
</head>
<body>

  <div id="overlay-carga" class="overlay-carga"><div class="spinner-carga"></div><span>Entrando...</span></div>
  <div class="login-box">
    <h2>Panel admin</h2>
    <p>Café Real — acceso interno.</p>

    {% with mensajes = get_flashed_messages() %}
      {% if mensajes %}
        <div class="mensajes">
          {% for m in mensajes %}
            <p>{{ m }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="text" name="usuario" placeholder="Usuario" required autofocus>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => {
          console.warn("No se pudo registrar el service worker:", err);
        });
      });
    }

    document.querySelector('form').addEventListener('submit', () => {
      document.getElementById('overlay-carga').classList.add('visible');
    });
  </script>
</body>
</html>
