<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión — Panel admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA: este archivo no extiende base.html, así que necesita su propio link -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F7F4EC">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Misma hoja de estilos que usa el resto del panel admin -->
  <link rel="stylesheet" href="/admin.css">

  <style>
    /* Lo único específico de esta pantalla (no vive en admin.css) */
    .overlay-carga{
      position:fixed; inset:0; z-index:999;
      background:rgba(2,16,14,.5);
      backdrop-filter:blur(5px) saturate(120%);
      -webkit-backdrop-filter:blur(5px) saturate(120%);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      opacity:0; pointer-events:none; transition:opacity .18s ease;
    }
    .overlay-carga.visible{ opacity:1; pointer-events:all; }
    .spinner-carga{
      width:34px; height:34px; border-radius:50%;
      border:3px solid rgba(255,255,255,.25); border-top-color:var(--blanco);
      animation:girar .7s linear infinite;
    }
    .overlay-carga span{ font-size:.82rem; color:var(--blanco); letter-spacing:.02em; }
    @keyframes girar{ to{ transform:rotate(360deg); } }

    .campo-password{ position:relative; }
    .campo-password input{ padding-right:44px; width:100%; }
    .toggle-password{
      position:absolute; right:10px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; padding:4px;
      color:var(--concreto); display:flex; align-items:center;
      transition:color .2s ease;
    }
    .toggle-password:hover{ color:var(--teal-osc); }
    .toggle-password svg{ width:19px; height:19px; }
  </style>
</head>
<body>

  <div id="overlay-carga" class="overlay-carga"><div class="spinner-carga"></div><span>Entrando...</span></div>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Panel admin</h1>
      <p class="subt">Café Real — acceso interno.</p>

      {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
          {% for m in mensajes %}
            <p class="flash">{{ m }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <label>Usuario</label>
        <input type="text" name="usuario" placeholder="Usuario" required autofocus>
        <label>Contraseña</label>
        <div class="campo-password">
          <input id="password" type="password" name="password" placeholder="Contraseña" required>
          <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña">
            <svg id="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn-solid">Entrar</button>
      </form>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => {
          console.warn("No se pudo registrar el service worker:", err);
        });
      });
    }

    document.querySelector('form').addEventListener('submit', () => {
      document.getElementById('overlay-carga').classList.add('visible');
    });

    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const iconoOjo = document.getElementById('icono-ojo');

    togglePassword.addEventListener('click', () => {
      const esOculta = passwordInput.type === 'password';
      passwordInput.type = esOculta ? 'text' : 'password';

      iconoOjo.innerHTML = esOculta
        ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle>';

      togglePassword.setAttribute('aria-label', esOculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  </script>
</body>
</html>
