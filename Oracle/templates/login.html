<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reservar cupo — {{ evento[1] }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{ --hierro:#161311; --hierro-2:#1d1a17; --crema:#f3ece2; --concreto:#a99c8c;
           --oro:#c9a24b; --oro-suave:#e0c27a; --linea:#332d27; }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--hierro); color:var(--crema);
      font-family:'Public Sans', Arial, sans-serif; padding:24px;
    }
    .reserva-box{
      width:100%; max-width:420px; background:var(--hierro-2);
      border:1px solid var(--linea); padding:36px 30px; border-radius:2px;
    }
    .reserva-box h2{ margin:0 0 6px; font-size:1.4rem; }
    .reserva-box p{ color:var(--concreto); font-size:.9rem; line-height:1.5; margin:0 0 18px; }
    #cupos-info{
      display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.78rem;
      color:var(--oro); border:1px solid var(--linea); padding:5px 10px; margin-bottom:22px;
    }
    form{ display:flex; flex-direction:column; gap:12px; }
    input{
      background:var(--hierro); border:1px solid var(--linea); color:var(--crema);
      padding:12px 14px; font-size:.92rem; border-radius:2px; outline:none;
    }
    input:focus{ border-color:var(--oro); }
    button{
      margin-top:6px; background:var(--oro); color:#1a1512; border:none;
      padding:13px; font-size:.92rem; font-weight:600; cursor:pointer; border-radius:2px;
    }
    button:hover{ background:var(--oro-suave); }
    button:disabled{ opacity:.5; cursor:not-allowed; }
    #msg{ margin-top:16px; font-size:.88rem; line-height:1.5; min-height:1.2em; }
    #msg.ok{ color:var(--oro-suave); }
    #msg.warn{ color:#e6a99b; }
  </style>
</head>
<body>
  <div class="reserva-box">
    <h2>{{ evento[1] }}</h2>
    <p>{{ evento[2] or 'Confirma tu asistencia a este evento.' }}</p>
    <span id="cupos-info"></span>

    <form id="form-reserva">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="text" id="apellido" placeholder="Apellido">
      <input type="tel" id="telefono" placeholder="Teléfono" required>
      <input type="number" id="num_personas" min="1" value="1" required>
      <button type="submit">Confirmar asistencia</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const EVENTO_ID = {{ evento[0] }};
    document.getElementById('cupos-info').textContent =
      "{{ evento[6] }} de {{ evento[5] }} cupos disponibles";

    document.getElementById('form-reserva').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      const body = {
        evento_id: EVENTO_ID,
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        telefono: document.getElementById('telefono').value,
        num_personas: document.getElementById('num_personas').value,
      };
      const res = await fetch('/api/reservas-cupo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const data = await res.json();
      const msg = document.getElementById('msg');
      if (data.confirmado) {
        msg.textContent = "¡Listo! Tu cupo quedó confirmado.";
        msg.className = "ok";
        e.target.style.display = "none";
      } else if (data.ok) {
        msg.textContent = data.mensaje;
        msg.className = "warn";
        e.target.style.display = "none";
      } else {
        msg.textContent = data.error || "Hubo un error.";
        msg.className = "warn";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
