<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reservar cupo — {{ evento[1] }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{ --hierro:#161311; --hierro-2:#1d1a17; --crema:#f3ece2; --concreto:#a99c8c;
           --oro:#c9a24b; --oro-suave:#e0c27a; --linea:#332d27; }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--hierro); color:var(--crema);
      font-family:'Public Sans', Arial, sans-serif; padding:24px;
    }
    .reserva-box{
      width:100%; max-width:420px; background:var(--hierro-2);
      border:1px solid var(--linea); padding:36px 30px; border-radius:2px;
    }
    .reserva-box h2{ margin:0 0 6px; font-size:1.4rem; color:var(--crema); }
    .reserva-box p{ color:var(--concreto); font-size:.9rem; line-height:1.5; margin:0 0 18px; }
    #cupos-info{
      display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.78rem;
      color:var(--oro); border:1px solid var(--linea); padding:5px 10px; margin-bottom:22px;
    }
    form{ display:flex; flex-direction:column; gap:12px; }
    input{
      width:100%; background:var(--hierro); border:1px solid var(--linea); color:var(--crema);
      padding:12px 14px; font-size:.92rem; border-radius:2px; outline:none; font-family:inherit;
    }
    input::placeholder{ color:var(--concreto); }
    input:focus{ border-color:var(--oro); }
    button{
      margin-top:6px; background:var(--oro); color:#1a1512; border:none;
      padding:13px; font-size:.92rem; font-weight:600; cursor:pointer; border-radius:2px;
      font-family:inherit;
    }
    button:hover{ background:var(--oro-suave); }
    button:disabled{ opacity:.5; cursor:not-allowed; }
    #msg{ margin-top:16px; font-size:.88rem; line-height:1.5; min-height:1.2em; }
    #msg.ok{ color:var(--oro-suave); }
    #msg.warn{ color:#e6a99b; }

    .btn-volver{
      display:none; margin-top:14px; text-align:center; text-decoration:none;
      background:transparent; color:var(--oro-suave); border:1px solid var(--oro);
      padding:11px; font-size:.88rem; font-weight:600; border-radius:2px; font-family:inherit;
    }
    .btn-volver:hover{ background:var(--oro); color:#1a1512; }
  </style>
</head>
<body>
  <div class="reserva-box">
    <h2>{{ evento[1] }}</h2>
    <p>{{ evento[2] or 'Confirma tu asistencia a este evento.' }}</p>
    <span id="cupos-info"></span>

    <form id="form-reserva">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="text" id="apellido" placeholder="Apellido">
      <input type="tel" id="telefono" placeholder="Teléfono" required>
      <button type="submit">Confirmar asistencia</button>
    </form>
    <div id="msg"></div>
    <div id="ticket-qr" style="display:none; text-align:center; margin-top:16px;">
      <img id="ticket-qr-img" src="" alt="Código QR de tu reserva" style="max-width:220px; width:100%; border-radius:2px;">
      <p id="ticket-codigo" style="font-family:'IBM Plex Mono', monospace; font-size:.8rem; color:var(--oro-suave); word-break:break-all; margin:10px 0;"></p>
      <p style="color:var(--concreto); font-size:.85rem; margin:0 0 12px;">Guarda este código, lo necesitarás en la entrada.</p>
      <a id="btn-descargar-ticket" href="#" class="btn-volver" style="display:block; margin-bottom:8px;">Descargar QR</a>
      <a id="btn-whatsapp-ticket" href="#" target="_blank" class="btn-volver" style="display:block;">Enviarme este link por WhatsApp</a>
    </div>
    <a id="btn-volver" href="/" class="btn-volver">Volver al inicio</a>
  </div>

  <script>
    const EVENTO_ID = {{ evento[0] }};
    document.getElementById('cupos-info').textContent =
      "{{ evento[6] }} de {{ evento[5] }} cupos disponibles";

    function formatearTelWA(tel) {
      let limpio = tel.replace(/\D/g, '');
      if (limpio.length === 10 && limpio.startsWith('3')) {
        limpio = '57' + limpio;
      }
      return limpio;
    }

    async function descargarQR(url, nombreArchivo) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = nombreArchivo;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(objectUrl);
      } catch (err) {
        window.open(url, '_blank');
      }
    }

    document.getElementById('form-reserva').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = "Enviando...";
      const body = {
        evento_id: EVENTO_ID,
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        telefono: document.getElementById('telefono').value,
        num_personas: 1,
      };
      const res = await fetch('/api/reservas-cupo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const data = await res.json();
      const msg = document.getElementById('msg');
      if (data.confirmado) {
        msg.textContent = "¡Listo! Tu cupo quedó confirmado.";
        msg.className = "ok";
        e.target.style.display = "none";
        document.getElementById('btn-volver').style.display = "block";

        if (data.codigo && data.link) {
          const urlQr = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(data.codigo);
          document.getElementById('ticket-qr-img').src = urlQr;
          document.getElementById('ticket-codigo').textContent = data.codigo;

          const telLimpio = formatearTelWA(document.getElementById('telefono').value);
          document.getElementById('btn-whatsapp-ticket').href =
            "https://wa.me/" + telLimpio + "?text=" + encodeURIComponent("Guardo el link de mi reserva a " + "{{ evento[1] }}" + ": " + data.link);

          document.getElementById('btn-descargar-ticket').addEventListener('click', (ev) => {
            ev.preventDefault();
            descargarQR(urlQr, 'ticket-' + data.codigo + '.png');
          });

          document.getElementById('ticket-qr').style.display = "block";
        }
    } else if (data.ok) {
        msg.textContent = data.mensaje;
        msg.className = "warn";
        e.target.style.display = "none";
        document.getElementById('btn-volver').style.display = "block";  
    } else {
        msg.textContent = data.error || "Hubo un error.";
        msg.className = "warn";
        btn.disabled = false;
      }
    });

    document.querySelectorAll('a.btn-mini, a.btn-confirmar, a.btn-rechazar').forEach(link => {
      link.addEventListener('click', function(e){
        if (this.dataset.noLoading) return; // por si algún link no debe mostrar loading
        const original = this.textContent;
        setTimeout(() => {
          this.textContent = "Un momento...";
          this.style.pointerEvents = "none";
          this.style.opacity = "0.6";
        }, 0);
      });
    });
  </script>
</body>
</html>
